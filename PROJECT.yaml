# PROJECT.yaml — machine-readable project contract. Single source of truth for volatile facts
# and gates; prose docs reference this file, never restate its values. Checked by /roadmap-lint.

name: skillcrossroads

authoritative_plan: ROADMAP.md

# idea | built | wired | live-proven | dogfooded | customer-used | revenue-proven
# App + CLI + Action are live-proven; the full money path (OAuth → Stripe Pro → entitlement →
# Pro scan) is dogfooded (2026-07-10). Not customer-used: zero arms-length users.
ladder: dogfooded

derived:
  test_count: "npx vitest run 2>&1 | grep 'Tests '"
  head: "git rev-parse --short HEAD"
  branch: "git branch --show-current"

# The one arms-length external demand signal this product has produced. Evidence or none.
demand_signal: none

gates:
  - id: G0-launch
    metric: external demand signal after posting the State of Claude Code Skills report to 1-2 dev communities (human-send by design)
    target: ">= 1 stranger-initiated scan (gallery opt-in, external badge embed, or Action install) OR >= 25 unique /report readers with >= 3 site scans OR >= 1 Team-tier inquiry, within 14 days of the post"
    kill: "2 launch posts + 4 weeks with 0 external scans -> stop feature work entirely; distribution/positioning experiments only until a signal exists"
    owner: Steve
    planned_post: 2026-09-17  # re-dated 2026-09-16 (Steve): the 9-15 post did not happen. Was 2026-09-15 (decided 9-09). LAUNCH_DATE re-set to match in .env.local + Vercel prod
    posted_on: 2026-09-17  # ACTUAL post: HN item 49744398, 2026-09-17T18:06:26Z. Matches planned_post
    due: 2026-10-01  # PROVISIONAL since 2026-09-18: computed from a post that was KILLED ~2 min after posting (see `killed`). The window moves with the ACTUAL post: on relist, set `relisted_on` and recompute due = relisted_on + 14. If no relist happens, Steve rules on what 10-01 measures
    killed:
      date: 2026-09-17
      when: "~18:08Z — flagged within about two minutes of the 18:06:26Z post (Steve's own report to hn@ycombinator.com, 18:16Z)"
      reason: "HN moderator (Daniel), 2026-09-17T18:36:18Z: the software classified the text as genai, which HN does not allow"
      evidence: "Gmail thread 1a0b08f5375c7d68 (sgharlow@gmail.com <-> hn@ycombinator.com)"
      relist_offer: "OPEN, unanswered at 2026-09-18 ~19:00 MST. HN will make a fresh copy with full /newest time in exchange for an entirely handwritten comment on the item plus a reply email. Steve writes every word; Claude must not draft, edit or polish any of it (that is what killed the first post)"
    relisted_on:  # set on relist, then recompute `due`
    open_question: "Does a killed post count as launch post 1 for the kill clause (2 launch posts + 4 weeks with 0 external scans)? It had ~2 minutes of exposure. Owner: Steve. Until ruled, the clause is read as NOT started"
    status: "KILLED 2026-09-17 by HN's genai classifier (see `killed`); relist offer OPEN.
      The 14-day window below was opened by a post that got ~2 minutes of exposure, so the
      arms-length signal it could produce is ~0 by construction and `due` is provisional.
      Before any relist, settle which count leads: the four counts on /report are all correct but
      measure different things (docs/launch/g0-baseline.md § FINDING 2026-09-18).

      HISTORY — as first written back 2026-09-17: LIVE — posted 2026-09-17T18:06:26Z as HN item 49744398
      (https://news.ycombinator.com/item?id=49744398, author sgharlow). Title as posted:
      `Show HN: Linting 216 public Claude Code skills – 69% won't reliably trigger`.
      Traction at 2026-09-17T21:03Z: 1 point, 0 comments. The 14-day window is OPEN:
      posted_on 2026-09-17 + 14 days = `due` 2026-10-01 (arithmetic confirmed, date unchanged
      because the post landed on planned_post). One launch post so far, so the kill clause
      (2 posts + 4 weeks, 0 external scans) cannot fire before a second post.

      ⚠️ THE POST IS UNTAGGED AND THE GATE'S OWN INSTRUMENT IS BLIND TO IT. The prepared draft
      (docs/launch/hn-show.md) specified https://skillcrossroads.com/report?ref=hn-show; the post
      went up with the bare apex https://skillcrossroads.com, so no HN arrival sets the `sc_ref`
      cookie and `attributedExternalScansSinceLaunch` stays 0 however many strangers scan.
      Fallback (live-proven, but NOT in `report:demand` — it must be read from the Vercel
      dashboard and logged by hand): Vercel Web Analytics `referrerHostname`. Full finding,
      consequences, and exactly what the fallback can and cannot answer:
      docs/launch/g0-baseline.md § FINDING 2026-09-17.

      2026-09-09 — the gate was MEASURING THE WRONG THING and would have passed itself. `evaluateG0`
      passed on `externalScansSinceLaunch > 0`, whose owner exclusion keys on `login`, which is NULL
      on all 15,510 prod scan rows; badge and gallery counts had no owner filter at all. Live audit:
      all 7 badge repos were sgharlow/*, all 31 gallery opt-ins were the owner's own or repos he
      scanned himself. Posting would have flipped the gate to live-signal within hours regardless of
      whether one stranger arrived. Fixed to the target above — only a stranger-initiated signal
      passes. Arms-length signal live after the fix: 0/0/0/0. See commit 2fe3a94.

      ON POST (RAN 2026-09-17, late — the post was ~3h old before this was written back):
      posted_on set, `due` confirmed = posted_on + 14 = 2026-10-01, counting started.
      LAUNCH_DATE=2026-09-17 is set in apps/web/.env.local and claimed set in Vercel production."

